<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DeepSeek Harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      /* Lock the WebView viewport to its window so internal flex containers
         (e.g. the conversation scrollport) handle their own scrolling.
         Without this, the body grows with content (TodoPanel, ApprovalPanel,
         etc.) and the whole page scrolls past the Tauri window. */
      html, body, #root { height: 100%; margin: 0; overflow: hidden; }
    </style>
  </body>
</html>
