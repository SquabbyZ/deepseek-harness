<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>in-box plugin smoke (vite dev)</title>
    <script>
      // Capture any later module / parse / runtime error before the main
      // module's own listeners install. window.__inboxLoadError is the
      // single source of truth the spec reads.
      window.__inboxLoadError = null
      window.addEventListener('error', function (e) {
        if (!window.__inboxLoadError) {
          window.__inboxLoadError = {
            kind: 'error',
            message: e.message,
            filename: e.filename,
            lineno: e.lineno,
            colno: e.colno,
            stack: (e.error && e.error.stack) || null,
            source: e.target && e.target.src ? e.target.src : null,
          }
        }
      }, true)
      window.addEventListener('unhandledrejection', function (e) {
        if (!window.__inboxLoadError) {
          window.__inboxLoadError = {
            kind: 'rejection',
            message: String(e.reason && e.reason.message ? e.reason.message : e.reason),
            stack: (e.reason && e.reason.stack) || null,
          }
        }
      }, true)
    </script>
  </head>
  <body>
    <div id="status">booting</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
